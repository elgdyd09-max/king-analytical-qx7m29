<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كينج التحليلي</title>
<meta name="description" content="اكتب توقعك للماتشات والكورة توصله للكينج. هو بس اللي يشوف كل التوقعات.">
<meta name="theme-color" content="#1d6a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كينج التحليلي">
<style>
:root {
  --page: #eef2ee;
  --ink: #1a1f1c;
  --ink-2: #5a645e;
  --hairline: #dfe4df;
  --red: #c0392b;
  --green: #1d6a3a;
  --green-dark: #12331f;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", "Cairo", sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
.card {
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px 32px;
}
.panel {
  background: #fff;
  border: 1px solid var(--hairline);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
}
.king-hero {
  background: repeating-linear-gradient(90deg, #1d6a3a 0 64px, #1a5f34 64px 128px);
  border-radius: 20px;
  padding: 28px 24px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.king-hero::after {
  content: "";
  position: absolute;
  inset: 10px;
  border: 2px solid rgba(255,255,255,0.28);
  border-radius: 14px;
  pointer-events: none;
}
.king-hero h1 { color: #fff; font-size: 26px; margin: 0 0 8px; }
.king-hero .intro { color: rgba(255,255,255,0.92); margin: 0; font-size: 15px; }
.king-hero .fact { color: #d8f3c0; font-size: 14px; margin: 8px 0 0; min-height: 1em; }
h2 { font-size: 18px; margin: 0 0 14px; }
.king-form { display: flex; flex-direction: column; gap: 14px; }
.king-ball-stage { position: relative; display: flex; justify-content: center; padding-top: 46px; margin-bottom: 2px; }
.king-ball { width: 96px; height: 96px; animation: king-rock 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
.king-ball-stage.is-thinking .king-ball { animation: king-spin 0.7s linear infinite; }
.king-ball-shadow { position: absolute; bottom: -6px; left: 50%; width: 76px; height: 12px; margin-inline-start: -38px; background: radial-gradient(closest-side, rgba(18,51,31,0.25), transparent); border-radius: 50%; }
.king-bubble { position: absolute; top: 0; inset-inline-start: calc(50% + 18px); display: flex; gap: 5px; background: #fff; border: 1.5px solid #12331f; border-radius: 14px; padding: 7px 11px; }
.king-bubble::after { content: ""; position: absolute; bottom: -7px; inset-inline-start: 10px; width: 10px; height: 10px; background: #fff; border-inline-end: 1.5px solid #12331f; border-bottom: 1.5px solid #12331f; transform: rotate(45deg); }
.king-bubble span { width: 7px; height: 7px; border-radius: 50%; background: #1d6a3a; animation: king-dot 1.2s ease-in-out infinite; }
.king-bubble span:nth-child(2) { animation-delay: 0.2s; }
.king-bubble span:nth-child(3) { animation-delay: 0.4s; }
@keyframes king-rock { 0%,100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(7deg) translateY(-6px); } }
@keyframes king-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes king-dot { 0%,100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
.king-think-line { text-align: center; color: var(--ink-2); margin: 0; font-size: 14px; }
label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 4px; }
input[type="text"], input[type="password"], textarea {
  width: 100%;
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 12px 14px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.6; }
input:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
.btn {
  border: none;
  border-radius: 10px;
  padding: 12px 22px;
  font: inherit;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  min-height: 48px;
}
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-primary { background: var(--green); color: #fff; }
.btn-secondary { background: #e8f0e9; color: var(--green-dark); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.king-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.king-error { color: var(--red); margin: 0; font-size: 14px; }
.king-loading { color: var(--ink-2); margin: 0; font-size: 14px; }
.king-admin-details { border-top: 1px solid var(--hairline); padding-top: 14px; }
.king-admin-details summary { cursor: pointer; color: var(--ink-2); font-size: 14px; min-height: 44px; display: flex; align-items: center; list-style: none; }
.king-admin-details summary::-webkit-details-marker { display: none; }
.king-admin-form { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.pred { border-top: 1px solid var(--hairline); padding: 10px 0; }
.pred:first-of-type { border-top: none; }
.pred .pred-name { font-weight: 700; font-size: 15px; }
.pred .pred-text { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.closing { text-align: center; color: var(--ink-2); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="king-hero">
    <h1>كينج التحليلي</h1>
    <p class="intro">عندك إحساس بنتيجة ماتش؟ اكتب توقعك وابعته. الكورة بتفكر وتوصله للكينج على طول، وهو بس اللي يشوف كل التوقعات.</p>
    <p class="fact" id="counter"></p>
  </div>

  <div class="panel">
    <h2>سجل توقعك</h2>
    <div class="king-form">
      <div class="king-ball-stage" id="ballStage" aria-hidden="true">
        <div class="king-bubble"><span></span><span></span><span></span></div>
        <div class="king-ball-shadow"></div>
        <svg class="king-ball" viewBox="0 0 100 100" role="img" aria-label="كورة بتفكر">
          <circle cx="50" cy="50" r="47" fill="#ffffff" stroke="#12331f" stroke-width="2.5" />
          <polygon points="50,32 67,44 60.5,64 39.5,64 33,44" fill="#12331f" />
          <g stroke="#12331f" stroke-width="2.5" fill="none">
            <line x1="50" y1="32" x2="50" y2="8" />
            <line x1="67" y1="44" x2="88" y2="34" />
            <line x1="60.5" y1="64" x2="76" y2="82" />
            <line x1="39.5" y1="64" x2="24" y2="82" />
            <line x1="33" y1="44" x2="12" y2="34" />
          </g>
          <g fill="#12331f">
            <polygon points="50,3 58,9 50,16 42,9" />
            <polygon points="93,28 97,37 89,41 84,33" />
            <polygon points="81,87 72,86 72,77 81,78" />
            <polygon points="19,87 19,78 28,77 28,86" />
            <polygon points="7,28 16,33 11,41 3,37" />
          </g>
        </svg>
      </div>
      <p class="king-think-line" id="thinkLine" role="status">اكتب توقعك والكورة توصله للكينج</p>
      <div>
        <label for="nameField">اسمك (اختياري)</label>
        <input type="text" id="nameField" autocomplete="name">
      </div>
      <div>
        <label for="predField">توقعك</label>
        <textarea id="predField" rows="3" maxlength="500" placeholder="مثال: الأهلي يكسب الزمالك اتنين لواحد، وصلاح يجيب جون" dir="rtl"></textarea>
      </div>
      <div class="king-actions">
        <button class="btn btn-primary" id="sendBtn" disabled>ابعت توقعك ⚽</button>
      </div>
      <p class="king-error" id="formError" role="alert" hidden></p>
    </div>
  </div>

  <div class="panel" id="adminPanel">
    <details class="king-admin-details" id="adminDetails">
      <summary>👑 دخول الكينج</summary>
      <div class="king-admin-form">
        <div>
          <label for="passField">الباسورد</label>
          <input type="password" id="passField" autocomplete="off">
        </div>
        <div class="king-actions">
          <button class="btn btn-secondary" id="loginBtn" disabled>دخول</button>
        </div>
        <p class="king-error" id="loginError" role="alert" hidden>الباسورد غلط.</p>
      </div>
    </details>
    <div id="dashboard" hidden>
      <h2 id="dashTitle">لوحة التوقعات</h2>
      <p class="king-error" id="dashError" role="alert" hidden></p>
      <p class="king-loading" id="dashLoading">بيجيب التوقعات…</p>
      <div id="dashList"></div>
      <div class="king-actions">
        <button class="btn btn-secondary" id="refreshBtn">تحديث</button>
        <button class="btn btn-ghost" id="closeDashBtn">قفل اللوحة</button>
      </div>
    </div>
  </div>

  <p class="closing">التوقعات بتتسجل بوقتها وبتظهر للكينج بس في لوحته الخاصة.</p>
</div>

<script>
const PANTRY_URL = 'https://getpantry.cloud/apiv1/pantry/94a7bd70-7799-4416-bdc9-f22731736def/basket/predictions';
const ADMIN_HASH = '9a03a0ca02947af3c25b4dd82e6e35575005e17cd3dfb2a9f51475a0ca1d088c';
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function readBasket() {
  const res = await fetch(PANTRY_URL, { headers: { Accept: 'application/json' } });
  if (res.status === 429) throw new Error('busy');
  if (!res.ok) throw new Error('read-failed');
  const data = await res.json();
  return Array.isArray(data.items) ? data.items : [];
}
async function writeBasket(content) {
  const res = await fetch(PANTRY_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(content),
  });
  if (res.status === 429) throw new Error('busy');
  if (!res.ok) throw new Error('write-failed');
}
async function appendPrediction(item) {
  try { await writeBasket({ items: [item] }); }
  catch { await sleep(10000); await writeBasket({ items: [item] }); }
}
async function sha256(text) {
  if (!window.crypto || !window.crypto.subtle) return null;
  const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
}
function formatTime(ts) {
  const date = new Date(ts);
  if (Number.isNaN(date.getTime())) return '';
  try {
    return date.toLocaleString('ar-EG', { timeZone: 'Africa/Cairo', weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  } catch { return date.toLocaleString('ar-EG'); }
}

const ballStage = document.getElementById('ballStage');
const thinkLine = document.getElementById('thinkLine');
const nameField = document.getElementById('nameField');
const predField = document.getElementById('predField');
const sendBtn = document.getElementById('sendBtn');
const formError = document.getElementById('formError');
const counter = document.getElementById('counter');

let phase = 'idle';
let sentCount = 0;
let baseCount = null;

function setPhase(p) {
  phase = p;
  ballStage.classList.toggle('is-thinking', p === 'sending');
  thinkLine.textContent =
    p === 'sending' ? 'الكورة بتفكر وبتبعت توقعك…' :
    p === 'sent' ? 'توقعك وصل للكينج ✅' :
    'اكتب توقعك والكورة توصله للكينج';
  sendBtn.disabled = !predField.value.trim() || p === 'sending';
  sendBtn.textContent = p === 'sending' ? 'بيبعت…' : 'ابعت توقعك ⚽';
  formError.hidden = p !== 'error' && p !== 'busy';
  if (p === 'error') formError.textContent = 'حصلت مشكلة والتوقع ماوصلش. جرب تاني.';
  if (p === 'busy') formError.textContent = 'فيه زحمة على السيرفر دلوقتي. استنى ثواني وجرب تاني.';
}
function updateCounter() {
  if (baseCount === null) { counter.textContent = ''; return; }
  counter.textContent = (baseCount + sentCount) + ' توقع لحد دلوقتي';
}
predField.addEventListener('input', () => {
  if (phase === 'sent' || phase === 'error' || phase === 'busy') setPhase('idle');
  else sendBtn.disabled = !predField.value.trim() || phase === 'sending';
});
sendBtn.addEventListener('click', async () => {
  const text = predField.value.trim();
  if (!text || phase === 'sending') return;
  setPhase('sending');
  const item = { ts: new Date().toISOString(), name: nameField.value.trim(), text };
  try {
    await appendPrediction(item);
    sentCount += 1;
    updateCounter();
    predField.value = '';
    setPhase('sent');
  } catch (e) {
    setPhase(e && e.message === 'busy' ? 'busy' : 'error');
  }
});
readBasket().then((items) => { baseCount = items.length; updateCounter(); }).catch(() => {});

// Admin gate
const passField = document.getElementById('passField');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const adminDetails = document.getElementById('adminDetails');
const dashboard = document.getElementById('dashboard');
const dashTitle = document.getElementById('dashTitle');
const dashError = document.getElementById('dashError');
const dashLoading = document.getElementById('dashLoading');
const dashList = document.getElementById('dashList');

passField.addEventListener('input', () => { loginBtn.disabled = !passField.value; loginError.hidden = true; });
passField.addEventListener('keydown', (e) => { if (e.key === 'Enter' && passField.value) loginBtn.click(); });

async function loadDashboard() {
  dashError.hidden = true;
  dashLoading.hidden = false;
  dashLoading.textContent = 'بيجيب التوقعات…';
  dashList.innerHTML = '';
  try {
    const items = await readBasket();
    dashLoading.hidden = true;
    dashTitle.textContent = 'لوحة التوقعات (' + items.length + ')';
    if (items.length === 0) {
      dashLoading.hidden = false;
      dashLoading.textContent = 'لسه مفيش توقعات. أول واحد يبعت يظهر هنا.';
      return;
    }
    items.slice().reverse().forEach((item) => {
      const div = document.createElement('div');
      div.className = 'pred';
      const name = document.createElement('div');
      name.className = 'pred-name';
      name.textContent = item.name || 'متوقع مجهول';
      const text = document.createElement('p');
      text.className = 'pred-text';
      const time = formatTime(item.ts);
      text.textContent = item.text + (time ? ' — ' + time : '');
      div.appendChild(name);
      div.appendChild(text);
      dashList.appendChild(div);
    });
  } catch (e) {
    dashLoading.hidden = true;
    dashError.hidden = false;
    dashError.textContent = e && e.message === 'busy' ? 'السيرفر مشغول شوية. دوس تحديث بعد ثواني.' : 'معرفتش أجيب التوقعات. دوس تحديث.';
  }
}
loginBtn.addEventListener('click', async () => {
  if (!passField.value) return;
  loginBtn.disabled = true;
  loginBtn.textContent = 'بلحظة…';
  const hash = await sha256(passField.value.trim());
  loginBtn.disabled = false;
  loginBtn.textContent = 'دخول';
  if (hash && hash === ADMIN_HASH) {
    passField.value = '';
    loginError.hidden = true;
    adminDetails.hidden = true;
    dashboard.hidden = false;
    loadDashboard();
  } else {
    loginError.hidden = false;
  }
});
document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
document.getElementById('closeDashBtn').addEventListener('click', () => {
  dashboard.hidden = true;
  adminDetails.hidden = false;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
